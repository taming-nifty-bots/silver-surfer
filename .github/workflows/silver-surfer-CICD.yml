name: Build and Deploy Silver Surfer

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: silver-surfer-deployment
  cancel-in-progress: false

env:
  SILVER_IMAGE_NAME: silver-surfer:${{ github.run_number }}
  ACR_NAME: ${{ secrets.ACR_NAME }}
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/executor:${{ github.workspace }}/signal

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline tests
        run: |
          python tests/test_silver.py

  build-and-deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: true

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build shared Docker image
        run: docker build -t "$ACR_NAME.azurecr.io/$SILVER_IMAGE_NAME" .

      - name: Push shared Docker image
        run: docker push "$ACR_NAME.azurecr.io/$SILVER_IMAGE_NAME"

      - name: Update all four job images without restarting
        uses: azure/CLI@v1
        with:
          inlineScript: |
            set -eu
            # Image-only updates preserve commands, environment and trigger/schedule settings.
            # Never start, stop or restart executions; stopped/manual jobs stay stopped.
            for job in silver-surfer-morning-signal silver-surfer-morning-executor silver-surfer-signal silver-surfer-executor; do
              az containerapp job update \
                --name "$job" \
                --resource-group "${{ secrets.RESOURCE_GROUP }}" \
                --image "${{ secrets.ACR_NAME }}.azurecr.io/${{ env.SILVER_IMAGE_NAME }}" \
                --output none
            done
